name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: world-card validate examples/minimal.world-card.json
      - run: world-card validate examples/fantasy-tavern.world-card.json
      - if: matrix.python-version == '3.12'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: matrix.python-version == '3.12'
        run: node spaces/world-card-converter/app.test.mjs
